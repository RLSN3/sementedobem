<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Empório Semente do Bem</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#2E5B33;--bg:#EFEADB;--brown:#624E31;--lime:#83B44C}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:#3b2f1d;font:400 1rem/1.7 'Montserrat',system-ui,sans-serif;text-align:center}
img{width:96px;height:96px}
h1{font:600 clamp(1.8rem,5vw,2.6rem)/1.2 'Lora',Georgia,serif;color:var(--deep);margin:16px 0 8px}
p{margin:0 auto 24px;max-width:40ch;color:var(--brown)}
a{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--deep);color:#fff;font-weight:600;text-decoration:none}
a:hover{background:#34702F}
a:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
@media (prefers-color-scheme:dark){:root{--bg:#172713;--brown:#C5BBA8}body{color:#EFEADB}h1{color:#AACD80}a{background:#AACD80;color:#10260f}a:hover{background:#bcdca0}}
</style>
</head>
<body>
<main>
<img src="/assets/favicon.svg" alt="" width="96" height="96">
<h1>Página não encontrada</h1>
<p>O endereço que você acessou não existe ou mudou. Volte para o início e encontre a loja mais perto de você.</p>
<a href="/">Voltar para o início</a>
</main>
</body>
</html>
